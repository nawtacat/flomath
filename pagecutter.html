<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4-Up PDF Reformatter - Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Controls -->
    <div class="lg:col-span-5 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-8 flex flex-col h-fit">
      <h1 class="text-3xl font-bold tracking-tight text-white mb-2">4-Up PDF Studio</h1>
      <p class="text-slate-400 text-sm mb-6">Compress 4 pages per sheet with precision layout controls.</p>

      <!-- Drop Zone -->
      <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 transition-colors rounded-xl p-6 text-center cursor-pointer bg-slate-800/50 mb-6">
        <input type="file" id="pdfInput" accept="application/pdf" class="hidden" />
        <svg class="mx-auto h-8 w-8 text-slate-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
          <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h24a4 4 0 004-4V20L28 8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M28 8v12h12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="text-sm font-medium text-slate-200" id="fileName">Upload PDF</p>
      </div>

      <!-- Settings -->
      <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-700/50 mb-6 space-y-5 flex-grow">
        
        <label class="flex items-center space-x-3 cursor-pointer">
          <input type="checkbox" id="hasCover" class="w-5 h-5 text-indigo-600 bg-slate-800 border-slate-600 rounded" />
          <span class="text-sm font-medium text-slate-200">First page is a Book Cover</span>
        </label>

        <hr class="border-slate-700" />

        <!-- Horizontal Crop Slider -->
        <div>
          <label class="flex justify-between text-sm font-medium text-slate-200 mb-2">
            <span>Crop Side Margins (Left / Right)</span>
            <span id="cropXDisplay" class="text-indigo-400">15%</span>
          </label>
          <input type="range" id="cropMarginX" min="0" max="40" value="15" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- Vertical Crop Slider -->
        <div>
          <label class="flex justify-between text-sm font-medium text-slate-200 mb-2">
            <span>Crop Vertical Margins (Top / Bottom)</span>
            <span id="cropYDisplay" class="text-indigo-400">3%</span>
          </label>
          <input type="range" id="cropMarginY" min="0" max="30" value="3" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- Center Pull Slider -->
        <div>
          <label class="flex justify-between text-sm font-medium text-slate-200 mb-2">
            <span>Center Pull (Reduce Gap)</span>
            <span id="pullDisplay" class="text-indigo-400">10 pt</span>
          </label>
          <input type="range" id="centerPull" min="0" max="40" value="10" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>
      </div>

      <!-- Export Button -->
      <button id="processBtn" disabled class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-medium rounded-xl transition shadow-lg">
        Download PDF
      </button>
    </div>

    <!-- Right Column: Live Preview -->
    <div class="lg:col-span-7 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col min-h-[600px]">
      <div class="bg-slate-900 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
        <span class="text-sm font-medium text-slate-300">Live Preview (First 5 Grids)</span>
        <div id="previewSpinner" class="hidden animate-spin h-4 w-4 border-2 border-indigo-400 border-t-transparent rounded-full"></div>
      </div>
      <iframe id="pdfPreview" class="w-full flex-grow bg-slate-700/30" src=""></iframe>
    </div>

  </div>

  <script>
    const ui = {
      input: document.getElementById('pdfInput'),
      drop: document.getElementById('dropZone'),
      fileDisplay: document.getElementById('fileName'),
      cover: document.getElementById('hasCover'),
      cropX: document.getElementById('cropMarginX'),
      cropXText: document.getElementById('cropXDisplay'),
      cropY: document.getElementById('cropMarginY'),
      cropYText: document.getElementById('cropYDisplay'),
      pull: document.getElementById('centerPull'),
      pullText: document.getElementById('pullDisplay'),
      btn: document.getElementById('processBtn'),
      preview: document.getElementById('pdfPreview'),
      spinner: document.getElementById('previewSpinner')
    };

    let globalSrcDoc = null;
    let selectedFilename = "document.pdf";
    let renderTimeout = null;
    let previewUrl = null;

    // UI Listeners
    ui.cropX.addEventListener('input', (e) => { ui.cropXText.textContent = `${e.target.value}%`; queueRender(true); });
    ui.cropY.addEventListener('input', (e) => { ui.cropYText.textContent = `${e.target.value}%`; queueRender(true); });
    ui.pull.addEventListener('input', (e) => { ui.pullText.textContent = `${e.target.value} pt`; queueRender(true); });
    ui.cover.addEventListener('change', () => queueRender(true));

    ui.drop.addEventListener('click', () => ui.input.click());
    ui.drop.addEventListener('dragover', (e) => { e.preventDefault(); ui.drop.classList.add('border-indigo-500'); });
    ui.drop.addEventListener('dragleave', () => ui.drop.classList.remove('border-indigo-500'));
    ui.drop.addEventListener('drop', (e) => {
      e.preventDefault();
      ui.drop.classList.remove('border-indigo-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    ui.input.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      if (file.type !== 'application/pdf') return alert('Please upload a PDF.');
      selectedFilename = file.name;
      ui.fileDisplay.textContent = file.name;
      ui.btn.disabled = false;
      
      const arrayBuffer = await file.arrayBuffer();
      globalSrcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
      queueRender(true);
    }

    function queueRender(isPreview) {
      if (!globalSrcDoc) return;
      clearTimeout(renderTimeout);
      if (isPreview) ui.spinner.classList.remove('hidden');
      renderTimeout = setTimeout(() => executeRender(isPreview), isPreview ? 350 : 0);
    }

    async function executeRender(isPreview) {
      const outDoc = await PDFLib.PDFDocument.create();
      const totalPages = globalSrcDoc.getPageCount();
      const hasCover = ui.cover.checked;
      
      const cropPercentX = parseInt(ui.cropX.value, 10) / 100;
      const cropPercentY = parseInt(ui.cropY.value, 10) / 100;
      const pullPt = parseInt(ui.pull.value, 10);
      
      let startIndex = 0;

      if (hasCover && totalPages > 0) {
        const [coverPage] = await outDoc.copyPages(globalSrcDoc, [0]);
        outDoc.addPage(coverPage);
        startIndex = 1;
      }

      const A4_WIDTH = PDFLib.PageSizes.A4[0];
      const A4_HEIGHT = PDFLib.PageSizes.A4[1];
      const quadW = A4_WIDTH / 2;
      const quadH = A4_HEIGHT / 2;
      const PADDING = 10; // Outer margin padding
      const availW = quadW - (PADDING * 2);
      const availH = quadH - (PADDING * 2);

      const basePositions = [
        { x: 0,     y: quadH }, // 1: Top-Left
        { x: 0,     y: 0     }, // 2: Bottom-Left
        { x: quadW, y: quadH }, // 3: Top-Right
        { x: quadW, y: 0     }  // 4: Bottom-Right
      ];

      // Process up to 5 grids for live preview, or all pages for full download
      const limit = isPreview ? Math.min(startIndex + 20, totalPages) : totalPages;

      for (let i = startIndex; i < limit; i += 4) {
        const canvasPage = outDoc.addPage([A4_WIDTH, A4_HEIGHT]);

        for (let slot = 0; slot < 4; slot++) {
          const pageIndex = i + slot;
          if (pageIndex >= totalPages) break;

          const srcPage = globalSrcDoc.getPage(pageIndex);
          const box = srcPage.getCropBox() || srcPage.getMediaBox();
          
          // Independent horizontal and vertical cropping
          const cropX = box.width * cropPercentX;
          const cropY = box.height * cropPercentY;

          const embeddedPage = await outDoc.embedPage(srcPage, {
            left: box.x + cropX,
            bottom: box.y + cropY,
            right: box.x + box.width - cropX,
            top: box.y + box.height - cropY,
          });

          const pos = basePositions[slot];
          const scale = Math.min(availW / embeddedPage.width, availH / embeddedPage.height);
          const scaledW = embeddedPage.width * scale;
          const scaledH = embeddedPage.height * scale;

          // Shift pages towards center grid
          let shiftX = 0, shiftY = 0;
          if (slot === 0) { shiftX = pullPt; shiftY = -pullPt; }
          else if (slot === 1) { shiftX = pullPt; shiftY = pullPt; }
          else if (slot === 2) { shiftX = -pullPt; shiftY = -pullPt; }
          else if (slot === 3) { shiftX = -pullPt; shiftY = pullPt; }

          let offsetX = pos.x + PADDING + (availW - scaledW) / 2 + shiftX;
          let offsetY = pos.y + PADDING + (availH - scaledH) / 2 + shiftY;

          // Safety clamp to prevent rendering off sheet edges
          offsetX = Math.max(0, Math.min(A4_WIDTH - scaledW, offsetX));
          offsetY = Math.max(0, Math.min(A4_HEIGHT - scaledH, offsetY));

          canvasPage.drawPage(embeddedPage, {
            x: offsetX,
            y: offsetY,
            width: scaledW,
            height: scaledH,
          });
        }
      }

      const pdfBytes = await outDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });

      if (isPreview) {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(blob);
        ui.preview.src = previewUrl;
        ui.spinner.classList.add('hidden');
      } else {
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `reformatted_${selectedFilename}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
      }
    }

    ui.btn.addEventListener('click', () => queueRender(false));
  </script>
</body>
</html>
