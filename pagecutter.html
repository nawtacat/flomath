<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4-Up PDF Reformatter - Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Precision Controls -->
    <div class="lg:col-span-5 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 flex flex-col h-fit">
      <h1 class="text-2xl font-bold tracking-tight text-white mb-1">4-Up PDF Studio Pro</h1>
      <p class="text-slate-400 text-xs mb-5">Fine-tune individual page margins with live preview.</p>

      <!-- Drop Zone -->
      <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 transition-colors rounded-xl p-4 text-center cursor-pointer bg-slate-800/50 mb-5">
        <input type="file" id="pdfInput" accept="application/pdf" class="hidden" />
        <svg class="mx-auto h-7 w-7 text-slate-400 mb-1" stroke="currentColor" fill="none" viewBox="0 0 48 48">
          <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h24a4 4 0 004-4V20L28 8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M28 8v12h12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="text-xs font-medium text-slate-200" id="fileName">Upload PDF Document</p>
      </div>

      <!-- Settings Panel -->
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 mb-5 space-y-4 text-xs">
        
        <!-- Toggles -->
        <div class="space-y-2">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" id="hasCover" class="w-4 h-4 text-indigo-600 bg-slate-800 border-slate-600 rounded" />
            <span class="font-medium text-slate-200">First page is a Book Cover</span>
          </label>

          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" id="mirrorGutter" class="w-4 h-4 text-indigo-600 bg-slate-800 border-slate-600 rounded" />
            <span class="font-medium text-slate-200">Mirror Left/Right on Even Pages (Book Gutter)</span>
          </label>
        </div>

        <hr class="border-slate-700/60" />

        <!-- 4-Axis Crop Controls -->
        <div class="space-y-3">
          <p class="font-semibold text-indigo-300 uppercase tracking-wider text-[10px]">Crop Margins Per Side</p>

          <!-- Left Crop -->
          <div>
            <div class="flex justify-between font-medium text-slate-200 mb-1">
              <span>Left Margin Crop</span>
              <span id="cropLDisplay" class="text-indigo-400">2%</span>
            </div>
            <input type="range" id="cropLeft" min="0" max="35" value="2" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          </div>

          <!-- Right Crop -->
          <div>
            <div class="flex justify-between font-medium text-slate-200 mb-1">
              <span>Right Margin Crop</span>
              <span id="cropRDisplay" class="text-indigo-400">18%</span>
            </div>
            <input type="range" id="cropRight" min="0" max="35" value="18" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          </div>

          <!-- Top Crop -->
          <div>
            <div class="flex justify-between font-medium text-slate-200 mb-1">
              <span>Top Margin Crop</span>
              <span id="cropTDisplay" class="text-indigo-400">3%</span>
            </div>
            <input type="range" id="cropTop" min="0" max="25" value="3" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          </div>

          <!-- Bottom Crop -->
          <div>
            <div class="flex justify-between font-medium text-slate-200 mb-1">
              <span>Bottom Margin Crop</span>
              <span id="cropBDisplay" class="text-indigo-400">3%</span>
            </div>
            <input type="range" id="cropBottom" min="0" max="25" value="3" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          </div>
        </div>

        <hr class="border-slate-700/60" />

        <!-- Center Pull -->
        <div>
          <div class="flex justify-between font-medium text-slate-200 mb-1">
            <span>Center Pull (Reduce Middle Gap)</span>
            <span id="pullDisplay" class="text-indigo-400">10 pt</span>
          </div>
          <input type="range" id="centerPull" min="0" max="40" value="10" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

      </div>

      <!-- Export Button -->
      <button id="processBtn" disabled class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-medium rounded-xl transition shadow-lg text-sm">
        Download Re-Formatted PDF
      </button>
    </div>

    <!-- Right Column: Live Preview -->
    <div class="lg:col-span-7 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col min-h-[650px]">
      <div class="bg-slate-900 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
        <span class="text-xs font-medium text-slate-300">Live Preview (First 5 Grids)</span>
        <div id="previewSpinner" class="hidden animate-spin h-4 w-4 border-2 border-indigo-400 border-t-transparent rounded-full"></div>
      </div>
      <iframe id="pdfPreview" class="w-full flex-grow bg-slate-700/30" src=""></iframe>
    </div>

  </div>

  <script>
    const ui = {
      input: document.getElementById('pdfInput'),
      drop: document.getElementById('dropZone'),
      fileDisplay: document.getElementById('fileName'),
      cover: document.getElementById('hasCover'),
      mirror: document.getElementById('mirrorGutter'),
      
      cropL: document.getElementById('cropLeft'),
      cropLText: document.getElementById('cropLDisplay'),
      cropR: document.getElementById('cropRight'),
      cropRText: document.getElementById('cropRDisplay'),
      cropT: document.getElementById('cropTop'),
      cropTText: document.getElementById('cropTDisplay'),
      cropB: document.getElementById('cropBottom'),
      cropBText: document.getElementById('cropBDisplay'),
      
      pull: document.getElementById('centerPull'),
      pullText: document.getElementById('pullDisplay'),
      btn: document.getElementById('processBtn'),
      preview: document.getElementById('pdfPreview'),
      spinner: document.getElementById('previewSpinner')
    };

    let globalSrcDoc = null;
    let selectedFilename = "document.pdf";
    let renderTimeout = null;
    let previewUrl = null;

    // UI Sliders Listener Binding
    const bindSlider = (elem, textElem, unit = '%') => {
      elem.addEventListener('input', (e) => {
        textElem.textContent = `${e.target.value}${unit}`;
        queueRender(true);
      });
    };

    bindSlider(ui.cropL, ui.cropLText);
    bindSlider(ui.cropR, ui.cropRText);
    bindSlider(ui.cropT, ui.cropTText);
    bindSlider(ui.cropB, ui.cropBText);
    bindSlider(ui.pull, ui.pullText, ' pt');

    ui.cover.addEventListener('change', () => queueRender(true));
    ui.mirror.addEventListener('change', () => queueRender(true));

    ui.drop.addEventListener('click', () => ui.input.click());
    ui.drop.addEventListener('dragover', (e) => { e.preventDefault(); ui.drop.classList.add('border-indigo-500'); });
    ui.drop.addEventListener('dragleave', () => ui.drop.classList.remove('border-indigo-500'));
    ui.drop.addEventListener('drop', (e) => {
      e.preventDefault();
      ui.drop.classList.remove('border-indigo-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    ui.input.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      if (file.type !== 'application/pdf') return alert('Please upload a valid PDF.');
      selectedFilename = file.name;
      ui.fileDisplay.textContent = file.name;
      ui.btn.disabled = false;
      
      const arrayBuffer = await file.arrayBuffer();
      globalSrcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
      queueRender(true);
    }

    function queueRender(isPreview) {
      if (!globalSrcDoc) return;
      clearTimeout(renderTimeout);
      if (isPreview) ui.spinner.classList.remove('hidden');
      renderTimeout = setTimeout(() => executeRender(isPreview), isPreview ? 350 : 0);
    }

    async function executeRender(isPreview) {
      const outDoc = await PDFLib.PDFDocument.create();
      const totalPages = globalSrcDoc.getPageCount();
      const hasCover = ui.cover.checked;
      const mirrorEven = ui.mirror.checked;

      const valCropL = parseInt(ui.cropL.value, 10) / 100;
      const valCropR = parseInt(ui.cropR.value, 10) / 100;
      const valCropT = parseInt(ui.cropT.value, 10) / 100;
      const valCropB = parseInt(ui.cropB.value, 10) / 100;
      const pullPt = parseInt(ui.pull.value, 10);

      let startIndex = 0;

      if (hasCover && totalPages > 0) {
        const [coverPage] = await outDoc.copyPages(globalSrcDoc, [0]);
        outDoc.addPage(coverPage);
        startIndex = 1;
      }

      const A4_WIDTH = PDFLib.PageSizes.A4[0];
      const A4_HEIGHT = PDFLib.PageSizes.A4[1];
      const quadW = A4_WIDTH / 2;
      const quadH = A4_HEIGHT / 2;
      const PADDING = 10;
      const availW = quadW - (PADDING * 2);
      const availH = quadH - (PADDING * 2);

      const basePositions = [
        { x: 0,     y: quadH }, // 1: Top-Left
        { x: 0,     y: 0     }, // 2: Bottom-Left
        { x: quadW, y: quadH }, // 3: Top-Right
        { x: quadW, y: 0     }  // 4: Bottom-Right
      ];

      const limit = isPreview ? Math.min(startIndex + 20, totalPages) : totalPages;

      for (let i = startIndex; i < limit; i += 4) {
        const canvasPage = outDoc.addPage([A4_WIDTH, A4_HEIGHT]);

        for (let slot = 0; slot < 4; slot++) {
          const pageIndex = i + slot;
          if (pageIndex >= totalPages) break;

          const srcPage = globalSrcDoc.getPage(pageIndex);
          const box = srcPage.getCropBox() || srcPage.getMediaBox();
          
          const bX = box.x || 0;
          const bY = box.y || 0;
          const bW = box.width || srcPage.getWidth();
          const bH = box.height || srcPage.getHeight();

          // Handle page mirroring for book gutters
          const isEven = (pageIndex + 1) % 2 === 0;
          const cropL = (mirrorEven && isEven) ? valCropR : valCropL;
          const cropR = (mirrorEven && isEven) ? valCropL : valCropR;

          const embedLeft = bX + (bW * cropL);
          const embedRight = Math.max(embedLeft + 10, bX + bW - (bW * cropR));
          const embedBottom = bY + (bH * valCropB);
          const embedTop = Math.max(embedBottom + 10, bY + bH - (bH * valCropT));

          const embeddedPage = await outDoc.embedPage(srcPage, {
            left: embedLeft,
            bottom: embedBottom,
            right: embedRight,
            top: embedTop,
          });

          const pos = basePositions[slot];
          const scale = Math.min(availW / embeddedPage.width, availH / embeddedPage.height);
          const scaledW = embeddedPage.width * scale;
          const scaledH = embeddedPage.height * scale;

          // Center pull vector shift
          let shiftX = 0, shiftY = 0;
          if (slot === 0) { shiftX = pullPt; shiftY = -pullPt; }
          else if (slot === 1) { shiftX = pullPt; shiftY = pullPt; }
          else if (slot === 2) { shiftX = -pullPt; shiftY = -pullPt; }
          else if (slot === 3) { shiftX = -pullPt; shiftY = pullPt; }

          let offsetX = pos.x + PADDING + (availW - scaledW) / 2 + shiftX;
          let offsetY = pos.y + PADDING + (availH - scaledH) / 2 + shiftY;

          // Boundary clamp
          offsetX = Math.max(0, Math.min(A4_WIDTH - scaledW, offsetX));
          offsetY = Math.max(0, Math.min(A4_HEIGHT - scaledH, offsetY));

          canvasPage.drawPage(embeddedPage, {
            x: offsetX,
            y: offsetY,
            width: scaledW,
            height: scaledH,
          });
        }
      }

      const pdfBytes = await outDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });

      if (isPreview) {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(blob);
        ui.preview.src = previewUrl;
        ui.spinner.classList.add('hidden');
      } else {
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `pro_reformatted_${selectedFilename}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
      }
    }

    ui.btn.addEventListener('click', () => queueRender(false));
  </script>
</body>
</html>
